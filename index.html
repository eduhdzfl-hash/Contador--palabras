<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador & Traductor Estudiantil</title>
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-blue-hover: #1557b0;
            --google-green: #1e8e3e;
            --google-green-hover: #137333;
            --google-red: #d93025;
            --google-red-hover: #b31412;
            --google-grey-bg: #f8f9fa;
            --google-card-bg: #ffffff;
            --google-text: #202124;
            --google-text-sub: #5f6368;
            --google-border: #dadce0;
        }
        body {
            font-family: "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--google-grey-bg);
            color: var(--google-text);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 840px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--google-border);
            padding-bottom: 16px;
        }
        h1 { margin: 0; font-size: 1.4rem; font-weight: 400; }
        .container {
            width: 100%;
            max-width: 840px;
            background: var(--google-card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
            border: 1px solid var(--google-border);
            box-sizing: border-box;
            overflow: hidden;
        }
        textarea {
            width: 100%;
            height: 240px;
            padding: 20px;
            border: none;
            font-size: 1.05rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            border-bottom: 1px solid var(--google-border);
        }
        .toolbar {
            display: flex;
            gap: 12px;
            padding: 12px 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
        }
        .group { display: flex; gap: 8px; }
        .btn {
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 4px; 
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-audio { background-color: var(--google-green); }
        .btn-stop { background-color: var(--google-red); }
        .btn-translate { background-color: var(--google-blue); }
        .select-lang {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--google-border);
            background: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            border-top: 1px solid var(--google-border);
        }
        .stat-card {
            padding: 16px;
            text-align: center;
            border-right: 1px solid var(--google-border);
            background: #ffffff;
        }
        .stat-card:last-child { border-right: none; }
        .stat-num { font-size: 1.6rem; font-weight: 500; color: var(--google-blue); }
        .stat-label { font-size: 0.75rem; color: var(--google-text-sub); text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Contador & Traductor Estudiantil</h1>
    </div>

    <div class="container">
        <textarea id="text-input" placeholder="Escribe o pega tu texto aquí..."></textarea>
        
        <div class="toolbar">
            <div class="group">
                <button class="btn btn-audio" id="btn-speak">Escuchar</button>
                <button class="btn btn-stop" id="btn-stop">Detener</button>
            </div>
            
            <div class="group">
                <select class="select-lang" id="target-lang">
                    <option value="en">Traducir a Inglés 🇺🇸</option>
                    <option value="fr">Traducir a Francés 🇫🇷</option>
                    <option value="es">Traducir a Español 🇪🇸</option>
                </select>
                <button class="btn btn-translate" id="btn-translate">Traducir Texto</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-num" id="word-count">0</div><div class="stat-label">Palabras</div></div>
            <div class="stat-card"><div class="stat-num" id="char-count">0</div><div class="stat-label">Caracteres</div></div>
            <div class="stat-card"><div class="stat-num" id="sentence-count">0</div><div class="stat-label">Oraciones</div></div>
            <div class="stat-card"><div class="stat-num" id="paragraph-count">0</div><div class="stat-label">Párrafos</div></div>
        </div>
    </div>

    <!-- Vinculamos el archivo de programación que crearemos a continuación -->
    <script src="script.js"></script>
</body>
</html>
