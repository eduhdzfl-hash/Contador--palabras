<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador & Lector Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
        
        /* Selector de Idioma Moderno */
        .lang-select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: white;
            font-size: 0.9rem;
            color: var(--text);
            cursor: pointer;
            outline: none;
        }
        .lang-select:focus { border-color: var(--primary); }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea:focus { border-color: var(--primary); }
        
        .voice-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--success-hover); }
        .btn-stop { background-color: #ef4444; }
        .btn-stop:hover { background-color: #dc2626; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .stat-card {
            background: var(--bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-num { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .stat-label { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="title-text">Contador & Lector Pro</h1>
        <!-- Selector de Idioma de la Página -->
        <select class="lang-select" id="lang-picker">
            <option value="es">Español 🇪🇸</option>
            <option value="en">English 🇺🇸</option>
            <option value="fr">Français 🇫🇷</option>
        </select>
    </div>

    <div class="container">
        <textarea id="text-input" placeholder="Escribe o pega tu texto aquí para contarlo y escucharlo..."></textarea>
        
        <div class="voice-controls">
            <button class="btn" id="btn-speak">Escuchar Texto</button>
            <button class="btn btn-stop" id="btn-stop">Detener</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-num" id="word-count">0</div><div class="stat-label" id="lbl-words">Palabras</div></div>
            <div class="stat-card"><div class="stat-num" id="char-count">0</div><div class="stat-label" id="lbl-chars">Caracteres</div></div>
            <div class="stat-card"><div class="stat-num" id="sentence-count">0</div><div class="stat-label" id="lbl-sentences">Oraciones</div></div>
            <div class="stat-card"><div class="stat-num" id="paragraph-count">0</div><div class="stat-label" id="lbl-paragraphs">Párrafos</div></div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('text-input');
        const wordCount = document.getElementById('word-count');
        const charCount = document.getElementById('char-count');
        const sentenceCount = document.getElementById('sentence-count');
        const paragraphCount = document.getElementById('paragraph-count');
        
        const btnSpeak = document.getElementById('btn-speak');
        const btnStop = document.getElementById('btn-stop');
        const langPicker = document.getElementById('lang-picker');

        // Textos de la página en diferentes idiomas
        const translations = {
            es: {
                title: "Contador & Lector Pro",
                placeholder: "Escribe o pega tu texto aquí para contarlo y escucharlo...",
                speak: "Escuchar Texto",
                stop: "Detener",
                words: "Palabras",
                chars: "Caracteres",
                sentences: "Oraciones",
                paragraphs: "Párrafos",
                alert: "Por favor, escribe algo para poder leerlo.",
                voiceLang: "es-ES"
            },
            en: {
                title: "Word Counter & Reader Pro",
                placeholder: "Type or paste your text here to count and listen...",
                speak: "Listen Text",
                stop: "Stop",
                words: "Words",
                chars: "Characters",
                sentences: "Sentences",
                paragraphs: "Paragraphs",
                alert: "Please type something to read.",
                voiceLang: "en-US"
            },
            fr: {
                title: "Compteur de Mots & Lecteur Pro",
                placeholder: "Écrivez ou collez votre texte ici pour compter et écouter...",
                speak: "Écouter le Texte",
                stop: "Arrêter",
                words: "Mots",
                chars: "Caractères",
                sentences: "Phrases",
                paragraphs: "Paragraphes",
                alert: "Veuillez écrire quelque chose à lire.",
                voiceLang: "fr-FR"
            }
        };

        // Cambiar idioma de la interfaz
        let currentLang = 'es';
        langPicker.addEventListener('change', (e) => {
            currentLang = e.target.value;
            const data = translations[currentLang];
            
            document.getElementById('title-text').textContent = data.title;
            textarea.placeholder = data.placeholder;
            btnSpeak.textContent = data.speak;
            btnStop.textContent = data.stop;
            document.getElementById('lbl-words').textContent = data.words;
            document.getElementById('lbl-chars').textContent = data.chars;
            document.getElementById('lbl-sentences').textContent = data.sentences;
            document.getElementById('lbl-paragraphs').textContent = data.paragraphs;
        });

        // Contador de Palabras
        textarea.addEventListener('input', () => {
            const text = textarea.value;
            charCount.textContent = text.length;
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            wordCount.textContent = words.length;
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            sentenceCount.textContent = sentences.length;
            const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
            paragraphCount.textContent = paragraphs.length;
        });

        // Lector de Voz inteligente (Lee en el idioma seleccionado)
        btnSpeak.addEventListener('click', () => {
            window.speechSynthesis.cancel();
            if (textarea.value.trim() === "") {
                alert(translations[currentLang].alert);
                return;
            }
            const utterance = new SpeechSynthesisUtterance(textarea.value);
            utterance.lang = translations[currentLang].voiceLang; 
            window.speechSynthesis.speak(utterance);
        });

        btnStop.addEventListener('click', () => {
            window.speechSynthesis.cancel();
        });
    </script>

</body>
</html>
