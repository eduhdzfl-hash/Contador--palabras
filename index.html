<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador, Lector & Traductor Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --info: #0ea5e9;
            --info-hover: #0284c7;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            box-sizing: border-box;
        }
        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        textarea:focus { border-color: var(--primary); }
        
        /* Barra de Herramientas */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        
        .btn {
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-audio { background-color: var(--success); }
        .btn-audio:hover { background-color: var(--success-hover); }
        .btn-stop { background-color: #ef4444; }
        .btn-stop:hover { background-color: #dc2626; }
        .btn-translate { background-color: var(--info); }
        .btn-translate:hover { background-color: var(--info-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .select-lang {
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .stat-card {
            background: var(--bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-num { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .stat-label { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Contador Profesional Multilingüe</h1>
    </div>

    <div class="container">
        <textarea id="text-input" placeholder="Escribe o pega tu texto aquí..."></textarea>
        
        <!-- Barra de Herramientas Inteligente -->
        <div class="toolbar">
            <!-- Bloque de Voz -->
            <div class="group">
                <button class="btn btn-audio" id="btn-speak">Escuchar</button>
                <button class="btn btn-stop" id="btn-stop">Detener</button>
            </div>
            
            <!-- Bloque de Traducción del Texto -->
            <div class="group">
                <select class="select-lang" id="target-lang">
                    <option value="en">Traducir a Inglés 🇺🇸</option>
                    <option value="fr">Traducir a Francés 🇫🇷</option>
                    <option value="de">Traducir a Alemán 🇩🇪</option>
                    <option value="it">Traducir a Italiano 🇮🇹</option>
                    <option value="es">Traducir a Español 🇪🇸</option>
                </select>
                <button class="btn btn-translate" id="btn-translate">Traducir Texto</button>
            </div>
        </div>

        <!-- Panel de Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-num" id="word-count">0</div><div class="stat-label">Palabras</div></div>
            <div class="stat-card"><div class="stat-num" id="char-count">0</div><div class="stat-label">Caracteres</div></div>
            <div class="stat-card"><div class="stat-num" id="sentence-count">0</div><div class="stat-label">Oraciones</div></div>
            <div class="stat-card"><div class="stat-num" id="paragraph-count">0</div><div class="stat-label">Párrafos</div></div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('text-input');
        const wordCount = document.getElementById('word-count');
        const charCount = document.getElementById('char-count');
        const sentenceCount = document.getElementById('sentence-count');
        const paragraphCount = document.getElementById('paragraph-count');
        
        const btnSpeak = document.getElementById('btn-speak');
        const btnStop = document.getElementById('btn-stop');
        const btnTranslate = document.getElementById('btn-translate');
        const targetLang = document.getElementById('target-lang');

        // Función para actualizar los contadores métricos
        function updateCounters() {
            const text = textarea.value;
            charCount.textContent = text.length;
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            wordCount.textContent = words.length;
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            sentenceCount.textContent = sentences.length;
            const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0);
            paragraphCount.textContent = paragraphs.length;
        }

        textarea.addEventListener('input', updateCounters);

        // Lector de Voz NATIVO (Auto-detecta o usa el navegador)
        btnSpeak.addEventListener('click', () => {
            window.speechSynthesis.cancel();
            if (textarea.value.trim() === "") {
                alert("Por favor, escribe algo para poder escucharlo.");
                return;
            }
            const utterance = new SpeechSynthesisUtterance(textarea.value);
            // El navegador intentará leer en el idioma que detecte o inglés si es traducido
            utterance.lang = 'es-ES';
            window.speechSynthesis.speak(utterance);
        });

        btnStop.addEventListener('click', () => {
            window.speechSynthesis.cancel();
        });

        // TRADUCTOR REAL DEL TEXTO DEL USUARIO (Vía API Gratuita Segura)
        btnTranslate.addEventListener('click', async () => {
            const textToTranslate = textarea.value.trim();
            if (textToTranslate === "") {
                alert("Escribe o pega un texto para poder traducirlo.");
                return;
            }

            const lang = targetLang.value;
            btnTranslate.textContent = "Traduciendo...";
            btnTranslate.disabled = true;

            try {
                // Consultamos el servicio de traducción gratuito seguro (HTTPS)
                const response = await fetch(`https://translated.net{encodeURIComponent(textToTranslate)}&langpair=autodetect|${lang}`);
                const data = await response.json();
                
                if (data.responseData && data.responseData.translatedText) {
                    // Reemplazamos el texto del cuadro por el texto ya traducido
                    textarea.value = data.responseData.translatedText;
                    // Forzamos actualización de contadores porque el texto cambió
                    updateCounters();
                } else {
                    alert("No se pudo traducir en este momento. Intenta de nuevo.");
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión al traducir.");
            } finally {
                btnTranslate.textContent = "Traducir Texto";
                btnTranslate.disabled = false;
            }
        });
    </script>

</body>
</html>
