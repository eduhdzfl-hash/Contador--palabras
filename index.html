<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Palabras Pro - Con Traductor y Voz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-num { display: block; font-size: 24px; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        button, select {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #e2e8f0;
        }
        button { background: var(--primary); color: white; border: none; }
        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        .btn-secondary:hover { background: #cbd5e1; }
        select { background: white; }
        .ads-space {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Contador de Palabras Profesional</h1>
    
    <textarea id="textInput" placeholder="Escribe o pega tu texto aquí..."></textarea>

    <!-- Panel de Estadísticas en Tiempo Real -->
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-num" id="wordCount">0</span>
            <span class="stat-label">Palabras</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" id="charCount">0</span>
            <span class="stat-label">Caracteres</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" id="readTime">0s</span>
            <span class="stat-label">Tiempo Lectura</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" id="speakTime">0s</span>
            <span class="stat-label">Tiempo Hablado</span>
        </div>
    </div>

    <!-- Panel de Funciones Extra (Voz y Traductor) -->
    <div class="controls">
        <!-- Controles de Voz -->
        <button id="btnSpeak">?? Escuchar Texto</button>
        <button id="btnStop" class="btn-secondary">?? Detener</button>
        
        <!-- Controles de Traducción -->
        <select id="langSelect">
            <option value="en">Traducir al Inglés</option>
            <option value="es">Traducir al Español</option>
            <option value="fr">Traducir al Francés</option>
            <option value="pt">Traducir al Portugués</option>
        </select>
        <button id="btnTranslate" class="btn-secondary">?? Traducir</button>
    </div>

    <!-- Espacio reservado para tus anuncios de Google AdSense -->
    <div class="ads-space">
        [Espacio Publicitario - Aquí irá tu código de Google AdSense]
    </div>
</div>

<script>
    const textInput = document.getElementById('textInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const readTime = document.getElementById('readTime');
    const speakTime = document.getElementById('speakTime');
    
    // 1. LÓGICA DEL CONTADOR EN TIEMPO REAL
    textInput.addEventListener('input', () => {
        const text = textInput.value.trim();
        
        // Contar caracteres
        charCount.innerText = textInput.value.length;
        
        // Contar palabras
        const words = text === "" ? [] : text.split(/\s+/);
        wordCount.innerText = words.length;
        
        // Calcular Tiempos Estimados (Lectura: ~200 ppm / Habla: ~130 ppm)
        if(words.length > 0) {
            const rMin = words.length / 200;
            const sMin = words.length / 130;
            
            readTime.innerText = rMin < 1 ? Math.ceil(rMin * 60) + 's' : Math.ceil(rMin) + 'm';
            speakTime.innerText = sMin < 1 ? Math.ceil(sMin * 60) + 's' : Math.ceil(sMin) + 'm';
        } else {
            readTime.innerText = '0s';
            speakTime.innerText = '0s';
        }
    });

    // 2. LÓGICA DEL LECTOR DE VOZ (TEXT-TO-SPEECH)
    const btnSpeak = document.getElementById('btnSpeak');
    const btnStop = document.getElementById('btnStop');
    let synth = window.speechSynthesis;

    btnSpeak.addEventListener('click', () => {
        if (textInput.value.trim() === "") return alert("Por favor, ingresa texto para leer.");
        if (synth.speaking) synth.cancel(); // Reinicia si ya estaba hablando

        let utterance = new SpeechSynthesisUtterance(textInput.value);
        // Detecta automáticamente si el texto está en inglés o español para usar la voz correcta
        utterance.lang = textInput.value.match(/[A-Za-z]/) ? 'es-ES' : 'en-US'; 
        synth.speak(utterance);
    });

    btnStop.addEventListener('click', () => {
        synth.cancel();
    });

    // 3. LÓGICA DEL TRADUCTOR GRATUITO (A través de API pública libre)
    const btnTranslate = document.getElementById('btnTranslate');
    const langSelect = document.getElementById('langSelect');

    btnTranslate.addEventListener('click', async () => {
        const text = textInput.value.trim();
        const targetLang = langSelect.value;
        if (text === "") return alert("Por favor, ingresa texto para traducir.");

        btnTranslate.innerText = "Traduciendo...";
        btnTranslate.disabled = true;

        try {
            // Usamos una API libre y gratuita de traducción que no requiere registro ni llaves de pago
            const res = await fetch(`https://googleapis.com{targetLang}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            
            // Reconstruir el texto traducido
            let translatedText = "";
            data[0].forEach(row => { if(row[0]) translatedText += row[0]; });
            
            textInput.value = translatedText;
            // Disparar el evento de conteo para actualizar las métricas con el nuevo texto
            textInput.dispatchEvent(new Event('input'));
        } catch (error) {
            alert("Hubo un error al traducir. Inténtalo de nuevo.");
        } finally {
            btnTranslate.innerText = "?? Traducir";
            btnTranslate.disabled = false;
        }
    });
</script>

</body>
</html>
